# Render blueprint for the Express API (free tier). The Next.js app deploys to Vercel.
services:
  - type: web
    name: preptrace-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -w @preptrace/api
    startCommand: npm run start -w @preptrace/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: MONGODB_URI
        sync: false # MongoDB Atlas free-tier connection string
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false # e.g. https://preptrace.vercel.app
      - key: BACKEND_URL
        sync: false # this service's public URL
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MAX_RPM
        value: "10"
