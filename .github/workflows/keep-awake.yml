# Keeps the Render free instance from spinning down after ~15 minutes idle,
# so the first visitor doesn't wait ~30-60s for a cold start.
#
# Setup: repo Settings -> Secrets and variables -> Actions -> Variables ->
#   New repository variable: API_URL = https://<your-service>.onrender.com
# The job is skipped (not failed) when API_URL is unset, so forks stay quiet.
#
# GitHub disables scheduled workflows after 60 days with no repo activity, and
# runs on the shared cron queue can be delayed past the 15-minute window. For a
# demo that must never be cold, pair this with an external monitor (see DEPLOYMENT.md).
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes, inside Render's ~15 minute idle window
  workflow_dispatch: # lets you wake it by hand before a demo

concurrency:
  group: keep-awake
  cancel-in-progress: false

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::notice::API_URL variable is not set - nothing to ping."
            exit 0
          fi
          # --retry covers the cold start itself: a sleeping instance can take ~60s
          # to answer, and the request that wakes it may time out first.
          code=$(curl -sS -o /tmp/body -w '%{http_code}' \
            --max-time 90 --retry 3 --retry-delay 20 --retry-all-errors \
            "${API_URL%/}/health") || true
          echo "HTTP $code"
          cat /tmp/body || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Health check failed (HTTP ${code:-none})."
            exit 1
          fi
